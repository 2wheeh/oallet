packages:
  - packages/*
  - tests/*
  - '!tests/packed-consumer'

autoInstallPeers: false
strictPeerDependencies: true

overrides:
  'cuer>qr': 0.5.5
  'valtio>use-sync-external-store': 1.6.0
  '@delight-labs/delightkit': file:./tests/delightkit/vendor/delight-labs-delightkit-0.0.0.tgz
  '@delight-labs/delightkit-core': file:./tests/delightkit/vendor/delight-labs-delightkit-core-0.0.0.tgz
  '@delight-labs/delightkit-cosmos': file:./tests/delightkit/vendor/delight-labs-delightkit-cosmos-0.0.0.tgz
  '@delight-labs/delightkit-evm': file:./tests/delightkit/vendor/delight-labs-delightkit-evm-0.0.0.tgz
  '@delight-labs/delightkit-walletconnect': file:./tests/delightkit/vendor/delight-labs-delightkit-walletconnect-0.0.0.tgz

peerDependencyRules:
  allowedVersions:
    # WalletConnect's transitive Solana packages have not widened their peer range for TypeScript 6 yet.
    typescript: '>=5 <7'

catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@biomejs/biome': 2.5.10
  '@playwright/test': ^1.62.1
  '@tanstack/react-query': ^5.102.1
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.1.0
  '@wagmi/core': ^3.6.4
  '@reown/walletkit': 1.5.6
  '@types/pngjs': ^6.0.5
  '@walletconnect/core': 2.23.10
  '@walletconnect/ethereum-provider': 2.23.10
  '@walletconnect/jsonrpc-utils': 1.0.8
  '@walletconnect/sign-client': 2.23.10
  '@walletconnect/utils': 2.23.10
  pngjs: 7.0.0
  prool: ^0.2.14
  publint: ^0.3.21
  qr: ^0.6.0
  react: ^19.2.8
  react-dom: ^19.2.8
  tsdown: ^0.21.9
  typescript: ^6.0.0
  valibot: ^1.4.2
  viem: ^2.55.19
  vite: ^8.2.2
  vitest: ^4.1.10
  wagmi: ^3.7.6
