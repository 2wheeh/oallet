packages:
  - packages/*
  - tests/*

autoInstallPeers: false
strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # WalletConnect's transitive Solana packages have not widened their peer range for TypeScript 6 yet.
    typescript: '>=5 <7'

catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@biomejs/biome': 2.5.10
  '@playwright/test': ^1.62.1
  '@tanstack/react-query': ^5.102.1
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.1.0
  '@reown/walletkit': 1.5.6
  '@types/pngjs': ^6.0.5
  '@walletconnect/core': 2.23.10
  '@walletconnect/ethereum-provider': 2.23.10
  '@walletconnect/jsonrpc-utils': 1.0.8
  '@walletconnect/utils': 2.23.10
  pngjs: 7.0.0
  prool: ^0.2.14
  publint: ^0.3.21
  qr: ^0.6.0
  react: ^19.2.8
  react-dom: ^19.2.8
  tsdown: ^0.21.9
  typescript: ^6.0.0
  valibot: ^1.4.2
  viem: ^2.55.19
  vite: ^8.2.2
  vitest: ^4.1.10
  wagmi: ^3.7.6
